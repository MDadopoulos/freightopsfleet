[project]
name = "freight-ops-fleet"
version = "0.1.0"
description = "A governed fleet of freight back-office agents on Google ADK + Gemini"
requires-python = ">=3.11"
dependencies = [
    # Pin this to the version you verified in BUILD-PLAN step 1.
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_fleet"]

[tool.hatch.build.targets.wheel.force-include]
"src/freight_fleet/prompts" = "freight_fleet/prompts"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]
