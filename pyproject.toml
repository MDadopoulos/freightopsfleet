[project]
name = "freight-ops-fleet"
version = "0.1.0"
description = "A governed fleet of freight back-office agents on Google ADK + Gemini"
requires-python = ">=3.11"
dependencies = [
    # Verified in BUILD-PLAN step 1 against 2.7.1: `before_tool_callback`
    # returning a dict short-circuits the tool body (tests/test_adk_contract.py).
    # Upper bound because that contract is load-bearing and unversioned — a
    # major bump must re-run the spike before it is allowed in.
    "google-adk[db]>=2.7.1,<3",  # [db]: DatabaseSessionService for durable local sessions (step 6a)
    "google-genai>=2.18.1,<3",
    "pyyaml>=6.0",
    # Already installed by google-adk; declared here because `console.py` imports
    # them directly and a direct import should be a declared dependency.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # DatabaseSessionService opens the session store with SQLAlchemy's ASYNC
    # engine, so the Cloud SQL URI needs an async driver present at import time
    # or the dev UI falls back to in-memory sessions with no error worth seeing.
    # Declared at runtime scope because the deployed chat service is the thing
    # that uses it (docs/DEPLOY.md §4d); the local default stays SQLite.
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Only `scripts/render_documents.py` needs these, and only when regenerating or
# re-sealing fixtures/raw/. Kept out of the runtime dependencies so the
# python:3.11-slim image does not grow ~45 MB for files that are committed.
#
# The versions are EXACT, not floors, because `--check` compares PDF bytes:
# fpdf2 writes its own version into /Producer-adjacent metadata and lays text
# out per release, and pypdfium2/Pillow raster output drifts between versions.
# A floor here would make the seal fail on an unrelated upgrade and teach
# everyone to ignore it.
render = [
    "fpdf2==2.8.8",
    "markdown-it-py==4.2.0",
    "pypdfium2==5.13.0",
    "Pillow==12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_fleet"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "eval", "scripts"]
testpaths = ["tests"]
